<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCH4 IA • OCR MAX (Blue Mask) – FIX</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b1220;--panel:#111827;--muted:#94a3b8;--accent:#06b6d4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#e5e7eb}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(90deg,#0ea5e9,#06b6d4);color:#001018;font-weight:800}
header .logo{font-weight:900;letter-spacing:.5px}
header .title{opacity:.85;font-weight:700}
main{max-width:980px;margin:24px auto;padding:0 16px 40px;display:grid;gap:16px}
.card{background:#111827cc;border:1px solid #1f2a3a;border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);border:none;color:#001018;font-weight:700;padding:10px 14px;border-radius:10px;cursor:pointer}
button.secondary{background:transparent;border:1px solid #334155;color:#e5e7eb}
button:disabled{opacity:.5;cursor:not-allowed}
video,canvas{width:100%;border-radius:12px;background:#0f172a;border:1px dashed #334155;min-height:260px;display:block}
textarea{width:100%;min-height:220px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:#e5e7eb;padding:12px;font-size:14px}
.hint{color:var(--muted);font-size:12px}
.progress{height:6px;background:#0b1220;border-radius:999px;overflow:hidden;border:1px solid #1f2a3a}
.bar{height:100%;width:0;background:var(--accent);transition:width .3s ease}
</style>
</head>
<body>
<header>
  <div class="logo">RCH4 IA</div>
  <div class="title">OCR + QR • Blue Mask (FIX)</div>
</header>

<main>
  <section class="card">
    <h2>1) Photo ou fichier</h2>
    <div class="row">
      <button id="btnStart">Activer la caméra</button>
      <button id="btnShot" class="secondary" disabled>Capturer</button>
      <input id="file" type="file" accept="image/*,.pdf" capture="environment" style="display:none">
      <button id="btnUpload" class="secondary">Importer une image ou un PDF</button>
    </div>
    <video id="video" playsinline></video>
    <canvas id="canvas" hidden></canvas>
  </section>

  <section class="card">
    <h2>2) Traitement OCR & QR</h2>
    <div class="row">
      <button id="btnProcess" disabled>Traiter (OCR + QR)</button>
      <button id="btnClear" class="secondary">Effacer</button>
    </div>
    <div class="progress" style="margin:10px 0"><div id="bar" class="bar"></div></div>
    <div id="status" class="hint">Prêt.</div>
    <textarea id="result" placeholder="Texte OCR nettoyé + contenu du QR…"></textarea>
  </section>

  <section class="card">
    <h2>3) Composer & envoyer à ChatGPT</h2>
    <div class="hint">Modèle de prompt (modifiable avant envoi) :</div>
    <textarea id="prompt"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="btnOpen">Ouvrir dans ChatGPT</button>
      <button id="btnCopy" class="secondary">Copier le prompt</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnStart = document.getElementById('btnStart');
const btnShot = document.getElementById('btnShot');
const btnUpload = document.getElementById('btnUpload');
const fileInput = document.getElementById('file');
const btnProcess = document.getElementById('btnProcess');
const btnClear = document.getElementById('btnClear');
const statusEl = document.getElementById('status');
const bar = document.getElementById('bar');
const result = document.getElementById('result');
const promptEl = document.getElementById('prompt');

let stream = null;
let capturedImage = null;

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }

function setStatus(msg,p=0){ statusEl.textContent = msg; bar.style.width = (p*100)+'%'; }
function showCanvas(){ video.hidden = true; canvas.hidden = false; }
function showVideo(){ video.hidden = false; canvas.hidden = true; }

function resizeIfNeeded(maxW=1600){
  if(canvas.width <= maxW) return;
  const scale = maxW / canvas.width;
  const tmp = document.createElement('canvas');
  tmp.width = maxW; tmp.height = Math.round(canvas.height * scale);
  tmp.getContext('2d').drawImage(canvas,0,0,tmp.width,tmp.height);
  canvas.width = tmp.width; canvas.height = tmp.height;
  ctx.drawImage(tmp,0,0);
}

function upscale2x(){
  const tmp = document.createElement('canvas');
  tmp.width = canvas.width * 2; tmp.height = canvas.height * 2;
  const tctx = tmp.getContext('2d');
  tctx.imageSmoothingEnabled = false;
  tctx.drawImage(canvas,0,0,tmp.width,tmp.height);
  canvas.width = tmp.width; canvas.height = tmp.height;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp,0,0);
}

function otsuBinarize(){
  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  const d = img.data, hist = new Array(256).fill(0);
  for(let i=0;i<d.length;i+=4){ const v=(d[i]+d[i+1]+d[i+2])/3|0; hist[v]++; }
  const total = canvas.width*canvas.height;
  let sum=0; for(let t=0;t<256;t++) sum += t*hist[t];
  let sumB=0,wB=0,max=0,th=127;
  for(let t=0;t<256;t++){ wB += hist[t]; if(!wB) continue; const wF=total-wB; if(!wF) break;
    sumB += t*hist[t]; const mB=sumB/wB; const mF=(sum-sumB)/wF;
    const between = wB*wF*(mB-mF)*(mB-mF);
    if(between>max){ max=between; th=t; }
  }
  for(let i=0;i<d.length;i+=4){ const v=(d[i]+d[i+1]+d[i+2])/3|0; const bw=v>th?255:0; d[i]=d[i+1]=d[i+2]=bw; }
  ctx.putImageData(img,0,0);
}

function readQR(){
  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  const code = jsQR(img.data, canvas.width, canvas.height, { inversionAttempts: 'attemptBoth' });
  return code ? { data: code.data, loc: code.location } : null;
}

function maskBlueArea() {
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data;
  const target = { r: 0, g: 0, b: 170 }; 
  const tol = 60;
  let minX=Infinity, minY=Infinity, maxX=-1, maxY=-1, hits=0;
  for (let y=0; y<canvas.height; y+=2) {
    for (let x=0; x<canvas.width; x+=2) {
      const i = (y*canvas.width + x)*4;
      const r = d[i], g = d[i+1], b = d[i+2];
      if (Math.abs(r-target.r)<tol && Math.abs(g-target.g)<tol && Math.abs(b-target.b)<tol) {
        hits++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (hits > 500) {
    ctx.save();
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(minX, minY, maxX-minX, maxY-minY);
    ctx.restore();
    return true;
  }
  return false;
}

function maskQRBox(location){
  if(!location) return false;
  const xs=[location.topLeftCorner.x, location.topRightCorner.x, location.bottomLeftCorner.x, location.bottomRightCorner.x];
  const ys=[location.topLeftCorner.y, location.topRightCorner.y, location.bottomLeftCorner.y, location.bottomRightCorner.y];
  const minX=Math.max(0,Math.min(...xs)-20), minY=Math.max(0,Math.min(...ys)-20);
  const maxX=Math.min(canvas.width,Math.max(...xs)+20), maxY=Math.min(canvas.height,Math.max(...ys)+20);
  ctx.save(); ctx.fillStyle='#FFFFFF'; ctx.fillRect(minX,minY,maxX-minX,maxY-minY); ctx.restore();
  return true;
}

function cleanText(s){
  return (s||'').replace(/[|_•·■□◆◇●◦·•]/g,'').replace(/[–—]/g,'-')
    .replace(/[“”«»]/g,'"').replace(/[’]/g,"'").replace(/\s{2,}/g,' ')
    .replace(/(\d)\s+(:)/g,'$1$2').trim();
}

async function doOCR(dataURL){
  return new Promise((resolve,reject)=>{
    Tesseract.recognize(dataURL,'fra+eng',{
      langPath:'https://tessdata.projectnaptha.com/4.0.0_best/',
      tessedit_pageseg_mode:'6', preserve_interword_spaces:'1', user_defined_dpi:'300',
      logger: m => { if(m.progress!=null) setStatus('OCR…', m.progress); }
    }).then(({data:{text}})=>resolve(text)).catch(reject);
  });
}

// Entrées
btnStart.onclick = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    video.srcObject = stream; await video.play();
    btnShot.disabled = false;
  }catch(e){ alert('Caméra non disponible : ' + e.message); }
};

btnShot.onclick = () => {
  const w = video.videoWidth || 1280, h = video.videoHeight || 720;
  canvas.width = w; canvas.height = h;
  ctx.drawImage(video,0,0,w,h); showCanvas();
  capturedImage = canvas.toDataURL('image/png');
  btnProcess.disabled = false;
};

btnUpload.onclick = () => fileInput.click();
fileInput.onchange = async (e) => {
  const file = e.target.files[0]; if(!file) return;
  if (file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf') {
    const arr = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({data:arr}).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale:2});
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: ctx, viewport}).promise;
    showCanvas(); capturedImage = canvas.toDataURL('image/png');
  } else {
    const img = new Image();
    img.onload = () => { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img,0,0); showCanvas(); capturedImage = canvas.toDataURL('image/png'); };
    img.src = URL.createObjectURL(file);
  }
  // ✅ FIX: une seule ligne valide
  btnProcess.disabled = false;
};

btnClear.onclick = () => { result.value=''; promptEl.value=''; bar.style.width='0%'; setStatus('Prêt.'); btnProcess.disabled = !capturedImage; };

// Pipeline
document.getElementById('btnProcess').onclick = async () => {
  if(!capturedImage) return alert('Aucune image.');
  try{
    setStatus('Lecture du QR…', 0.08);
    const qrObj = readQR();
    const qrData = qrObj ? qrObj.data : '';

    setStatus('Masquage zone BLEUE…', 0.12);
    const maskedBlue = maskBlueArea();
    if (!maskedBlue && qrObj && qrObj.loc) { setStatus('Masquage zone QR…', 0.15); maskQRBox(qrObj.loc); }

    setStatus('Redimensionnement…', 0.18); resizeIfNeeded(1200);
    setStatus('Upscale ×2…', 0.22); upscale2x();
    setStatus('Binarisation (Otsu)…', 0.26); otsuBinarize();

    setStatus('OCR…', 0.30);
    const text = await doOCR(canvas.toDataURL('image/png'));
    const cleaned = cleanText(text);
    const compiled = `# Texte OCR
${cleaned}

# QR
${qrData || '(aucun code détecté)'}`;
    result.value = compiled;

    const defaultPrompt = `Analyse cette fiche opérationnelle RCH (texte OCR + QR).
Objectif: extraire les infos clés (produit, dangers, AEGL/IDLH, zones, moyens, décisions) et proposer un plan d'action RCH3/RCH4.
---
${compiled}`;
    promptEl.value = defaultPrompt;
    setStatus('Terminé.', 1);
  }catch(err){
    console.error(err); alert('Erreur traitement: ' + err.message);
    setStatus('Erreur.');
  }
};

document.getElementById('btnOpen').onclick = () => {
  const q = encodeURIComponent(promptEl.value || result.value || '');
  if(!q){ alert('Prompt vide.'); return; }
  window.open('https://chat.openai.com/?q=' + q, '_blank');
};
document.getElementById('btnCopy').onclick = async () => {
  await navigator.clipboard.writeText(promptEl.value || result.value || '');
  document.getElementById('btnCopy').textContent='Copié !';
  setTimeout(()=>document.getElementById('btnCopy').textContent='Copier le prompt', 1200);
};
</script>
</body>
</html>
